[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Los nombres de pestañas no son secretos reales; omitir del secrets scan
  SECRETS_SCAN_OMIT_KEYS = "TAB_FACTURAS,TAB_VENTAS,TAB_MERMA"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Funciones programadas (Informes automáticos) ──────────────────────────────
# Variables de entorno requeridas en el panel de Netlify:
#   CRON_SECRET, NEXT_PUBLIC_BASE_URL, REPORT_RECIPIENTS, RESEND_API_KEY, RESEND_FROM

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Informe semanal — siempre a las 09:00 hora Chile, los martes.
# Netlify programa el cron en UTC fijo y no ajusta por huso horario/DST, y
# Chile cambia entre UTC-3 (verano) y UTC-4 (invierno) sin que el cron se
# entere — por eso se dispara DOS VECES (12:00 y 13:00 UTC, una para cada
# posible huso horario) y /api/informes/cron descarta en silencio el
# disparo que no cae justo a las 9:00 hora Chile real en ese momento
# (calculada con Intl, no con fechas de corte hardcodeadas).
# Cubre los últimos 7 días completos (hasta ayer), sin omitir fin de semana ni lunes
[[scheduled_functions]]
  name = "report-weekly"
  cron = "0 12,13 * * 2"

# Informe mensual — siempre a las 09:00 hora Chile, el día 1 de cada mes.
# Mismo mecanismo de doble disparo que el semanal, ver comentario arriba.
# Cubre el mes anterior completo
[[scheduled_functions]]
  name = "report-monthly"
  cron = "0 12,13 1 * *"
